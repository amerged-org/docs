components:
  headers:
    ETag:
      description: Opaque current resource version used by If-Match.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
    XRequestId:
      description: Correlates the request with operations, events, logs, and audit records.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  parameters:
    AuditCursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the preceding page.
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
    AuditLimit:
      name: limit
      in: query
      description: Maximum number of audit events to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Identifies one mutation and its canonical request payload.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      description: Exact ETag returned for the current project or deployment state.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
    ConfirmationToken:
      name: X-Confirmation-Token
      in: header
      description: Ten-minute token bound to the planned action, project, target resource, and resource ETag.
      required: true
      schema:
        $ref: "#/components/schemas/ConfirmationToken"
    RequestId:
      name: X-Request-Id
      in: header
      description: Optional caller-provided correlation identifier.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProjectId:
      name: project_id
      in: path
      description: Project identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    DatabaseAccessId:
      name: access_id
      in: path
      description: Issued database credential identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    DatabaseEnvironmentFilter:
      name: environment
      in: query
      description: Restrict the listing to one application environment.
      required: false
      schema:
        type: string
        enum: [dev, prod]
    ProjectCursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the preceding project page.
      required: false
      schema:
        $ref: "#/components/schemas/Ulid"
    ProjectLimit:
      name: limit
      in: query
      description: Maximum number of projects to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EnvironmentId:
      name: environment_id
      in: path
      description: Environment identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    SecretName:
      name: secret_name
      in: path
      description: Uppercase environment-variable name.
      required: true
      schema:
        type: string
        pattern: ^[A-Z][A-Z0-9_]{0,127}$
    OperationId:
      name: operation_id
      in: path
      description: Operation identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    DeploymentId:
      name: deployment_id
      in: path
      description: Deployment identifier.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    TargetDeploymentId:
      name: target_deployment_id
      in: path
      description: Immutable deployment selected as the rollback target.
      required: true
      schema:
        $ref: "#/components/schemas/Ulid"
    SourceDeploymentId:
      name: source_deployment_id
      in: path
      required: true
      description: Current succeeded dev deployment whose immutable artifact will be promoted.
      schema:
        $ref: "#/components/schemas/Ulid"
    DeploymentCursor:
      name: cursor
      in: query
      description: Opaque continuation cursor returned by the preceding deployment page.
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
    DeploymentLimit:
      name: limit
      in: query
      description: Maximum number of deployments to return.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ProjectFilter:
      name: project_id
      in: query
      description: Restricts the page to one visible project.
      required: false
      schema:
        $ref: "#/components/schemas/Ulid"
    OperationFilter:
      name: operation_id
      in: query
      description: Restricts the page to one visible operation.
      required: false
      schema:
        $ref: "#/components/schemas/Ulid"
  responses:
    AcceptedOperation:
      description: The mutation was accepted for asynchronous processing.
      headers:
        Location:
          description: Relative URL of the durable operation resource.
          required: true
          schema:
            type: string
            pattern: ^/v1/operations/[0-9A-HJKMNP-TV-Z]{26}$
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"
    Problem:
      description: The request failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ResourceNotFound:
      description: The resource does not exist or is not visible to the authenticated principal.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            resourceNotFound:
              value:
                type: https://docs.ohmyho.st/errors/resource-not-found
                title: Resource not found
                status: 404
                code: resource_not_found
                request_id: req_01J00000000000000000000000
                retryable: false
                suggested_action: Check the resource identifier and your access scope.
    IdempotencyConflict:
      description: The idempotency key was already used with a different canonical request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/IdempotencyConflictProblem"
          examples:
            reusedKey:
              value:
                type: https://docs.ohmyho.st/errors/idempotency-key-reused
                title: Idempotency key reused
                status: 409
                code: idempotency_key_reused
                request_id: req_01J00000000000000000000000
                retryable: false
                suggested_action: Retry with a new idempotency key.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: WorkOS access JWT or a user-owned WorkOS API key. User keys are bound to one organization and restricted to their enabled product permissions. Session-only onboarding and session revocation require an interactive access JWT. No cookie session is assumed.
  schemas:
    ManagedMailDomainRequest:
      type: object
      additionalProperties: false
      required: [domain, sending, receiving]
      properties:
        domain: { type: string, minLength: 4, maxLength: 253 }
        sending: { type: boolean }
        receiving: { type: boolean }
    ManagedMailWebhookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
    ManagedMailDnsRecord:
      type: object
      additionalProperties: false
      required: [type, name, value, purpose, status]
      properties:
        type: { type: string, enum: [TXT, CNAME, MX] }
        name: { type: string }
        value: { type: string }
        purpose: { type: string }
        status: { type: string }
        priority: { type: integer, minimum: 0, maximum: 65535 }
    ManagedMailDomain:
      type: object
      additionalProperties: false
      required:
        [
          domain_id,
          domain,
          environment_id,
          sending,
          receiving,
          status,
          configured_at,
          observed_at,
          dns_records,
          webhook,
          next_check_after_seconds,
        ]
      properties:
        domain_id: { $ref: "#/components/schemas/Ulid" }
        domain: { type: string }
        environment_id: { $ref: "#/components/schemas/Ulid" }
        sending: { type: string, enum: [disabled, pending, ready, failed] }
        receiving: { type: string, enum: [disabled, pending, ready, failed] }
        status: { type: string, enum: [ready, verification_pending] }
        configured_at: { type: string, format: date-time }
        observed_at: { type: [string, "null"], format: date-time }
        dns_records:
          type: array
          items: { $ref: "#/components/schemas/ManagedMailDnsRecord" }
        dns:
          type: object
          additionalProperties: false
          required: [status, records]
          properties:
            status: { type: string, enum: [configured, action_required, conflict] }
            records:
              type: array
              items: { $ref: "#/components/schemas/ManagedMailDnsRecord" }
        webhook:
          type: [object, "null"]
          additionalProperties: false
          required: [url, verified]
          properties:
            url: { type: string, format: uri }
            verified: { type: boolean }
        next_check_after_seconds: { type: [integer, "null"], enum: [60, null] }
    ManagedMailWebhook:
      type: object
      additionalProperties: false
      required: [url, signing_secret, status]
      properties:
        url: { type: string, format: uri }
        signing_secret:
          {
            type: string,
            description: Server-only signing secret. Never log or send it to the browser.,
          }
        status: { type: string, const: verification_required }
    ManagedMailDisabled:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: disabled }
    ManagedMailExpired:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: expired }
    ManagedMailRetryResult:
      type: object
      additionalProperties: false
      required: [attempted]
      properties:
        attempted: { type: boolean }
        delivered: { type: boolean }
    ManagedMailMessagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [message_id, received_at, state, attempts]
            properties:
              message_id: { $ref: "#/components/schemas/Ulid" }
              received_at: { type: string, format: date-time }
              state:
                { type: string, enum: [pending, delivering, delivered, delivery_failed, expired] }
              attempts: { type: integer, minimum: 0, maximum: 4 }
    ManagedMailContentResult:
      oneOf:
        - $ref: "#/components/schemas/ManagedMailExpired"
        - $ref: "#/components/schemas/ManagedMailContent"
    ManagedMailContent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          domain,
          received_at,
          expires_at,
          from,
          to,
          subject,
          text,
          html,
          message_id,
          attachments,
        ]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        domain: { type: string }
        received_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        from: { type: string }
        to: { type: array, items: { type: string } }
        subject: { type: string }
        text: { type: [string, "null"] }
        html: { type: [string, "null"] }
        message_id: { type: string }
        attachments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, filename, content_type, download_path]
            properties:
              id: { type: string }
              filename: { type: [string, "null"] }
              content_type: { type: string }
              download_path: { type: string }
    FeatureVoteChoices:
      type: array
      minItems: 3
      maxItems: 3
      description: One entry for each roadmap topic; no personal data or other browsers' votes.
      items:
        type: object
        additionalProperties: false
        required: [feature, choice]
        properties:
          feature: { type: string, enum: [eu, iso27001, soc2] }
          choice: { type: [string, "null"], enum: [up, down, null] }
    FeatureVoteState:
      type: object
      additionalProperties: false
      required: [votes]
      properties:
        votes:
          $ref: "#/components/schemas/FeatureVoteChoices"
    UserApiKeyId:
      type: string
      pattern: "^api_key_[A-Za-z0-9_]{1,120}$"
    UserApiKey:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organization_id,
          name,
          obfuscated_value,
          permissions,
          expires_at,
          created_at,
          last_used_at,
        ]
      properties:
        id: { $ref: "#/components/schemas/UserApiKeyId" }
        organization_id: { $ref: "#/components/schemas/Ulid" }
        name: { type: string, minLength: 1, maxLength: 128 }
        obfuscated_value: { type: string, pattern: '^sk_(?:\.\.\.|…)[A-Za-z0-9_-]{1,12}$' }
        permissions:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9_.*:-]{1,128}$" }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    UserApiKeyCreation:
      type: object
      additionalProperties: false
      required: [request_id, replayed, key, value]
      properties:
        request_id: { $ref: "#/components/schemas/Ulid" }
        replayed: { type: boolean }
        key: { $ref: "#/components/schemas/UserApiKey" }
        value: { type: [string, "null"], pattern: "^sk_[A-Za-z0-9_-]{20,128}$" }
      oneOf:
        - properties: { replayed: { const: false }, value: { type: string } }
        - properties: { replayed: { const: true }, value: { type: "null" } }
    UserApiKeyPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/UserApiKey" }
        next_cursor: { type: [string, "null"], pattern: "^api_key_[A-Za-z0-9_]{1,120}$" }
    CreditMicros:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: Non-negative microcredits, at most 9223372036854775807. One credit equals 1000000 microcredits.
    BillingTaxIssue:
      description: Verified issue on an existing Stripe invoice; no new purchase is needed.
      type: [object, "null"]
      additionalProperties: false
      required: [code, invoice_id, observed_at, required_action]
      properties:
        code:
          type: string
          enum:
            [
              billing_tax_location_required,
              billing_tax_calculation_failed,
              billing_tax_configuration_required,
            ]
        invoice_id: { type: string, pattern: "^in_[A-Za-z0-9_]{1,253}$" }
        observed_at: { type: string, format: date-time }
        required_action: { type: string, enum: [open_billing_portal, contact_support] }
    BillingRecharge:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          portal_available,
          enabled,
          revision,
          status,
          monthly_limit_minor,
          spent_minor,
          currency,
          amount_minor,
          credits,
          threshold_credits,
          setup_url,
          invoice_url,
          billing_issue,
        ]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        portal_available:
          type: boolean
          description: An existing customer in this billing account is ready for a hosted billing-portal handoff; this does not imply a paid subscription.
        enabled: { type: boolean }
        revision: { type: integer, minimum: 0 }
        status:
          {
            type: string,
            enum:
              [
                off,
                setup_required,
                on,
                payment_required,
                monthly_limit,
                needs_reconciliation,
                tax_required,
              ],
          }
        monthly_limit_minor: { type: integer, minimum: 1000, maximum: 100000 }
        spent_minor: { type: integer, minimum: 0 }
        currency: { type: string, const: usd }
        amount_minor: { type: integer, const: 900 }
        credits: { type: integer, const: 1000 }
        threshold_credits: { type: integer, const: 100 }
        setup_url: { type: [string, "null"], format: uri, maxLength: 8192 }
        invoice_url: { type: [string, "null"], format: uri, maxLength: 8192 }
        billing_issue: { $ref: "#/components/schemas/BillingTaxIssue" }
    BillingCheckout:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          checkout_id,
          offer,
          state,
          payment_confirmed,
          url,
          expires_at,
          packs,
          credited_micros,
          revoked_micros,
          paid_until,
          required_action,
          billing_issue,
        ]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        checkout_id: { $ref: "#/components/schemas/Ulid" }
        offer: { type: string, enum: [topup, paid] }
        state: { type: string, enum: [open, complete, expired] }
        payment_confirmed: { type: boolean }
        url: { type: [string, "null"], format: uri, maxLength: 8192 }
        expires_at: { type: string, format: date-time }
        packs: { type: integer, minimum: 1, maximum: 100 }
        credited_micros: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
        revoked_micros: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
        paid_until: { type: [string, "null"], format: date-time }
        required_action:
          type: string
          enum: [none, complete_checkout, open_billing_portal, contact_support]
          description: Human payment handoff. Complete the returned Checkout URL, request a fresh billing portal URL to correct billing details, or contact ohmyho.st when tax configuration requires review. none includes a draft invoice awaiting automatic processing; it is not a claim of current Paid coverage. Never infer renewal success from the historical payment_confirmed flag.
        billing_issue: { $ref: "#/components/schemas/BillingTaxIssue" }
    BillingPortal:
      type: object
      additionalProperties: false
      required: [organization_id, url, created_at]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        url: { type: string, format: uri, maxLength: 8192 }
        created_at: { type: string, format: date-time }
    OrganizationCredits:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          unit,
          as_of,
          available_micros,
          reserved_micros,
          spent_micros,
          expired_micros,
          platform_overrun_micros,
          grace_started_at,
          grace_expires_at,
          active_meters,
          rate_cards,
        ]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        unit:
          type: string
          const: microcredits
        as_of:
          type: string
          format: date-time
        available_micros:
          $ref: "#/components/schemas/CreditMicros"
        reserved_micros:
          $ref: "#/components/schemas/CreditMicros"
        spent_micros:
          $ref: "#/components/schemas/CreditMicros"
        expired_micros:
          $ref: "#/components/schemas/CreditMicros"
        platform_overrun_micros:
          $ref: "#/components/schemas/CreditMicros"
        grace_started_at:
          type: [string, "null"]
          format: date-time
          description: First confirmed exhaustion in this continuous period; null while funded.
        grace_expires_at:
          type: [string, "null"]
          format: date-time
          description: Seven days after first confirmed exhaustion. Existing services and domains are retained during this grace; no automatic data deletion. Explicit project stop budgets are separate.
        active_meters:
          type: array
          items:
            type: string
            pattern: ^[a-z0-9_.-]{1,128}$
        rate_cards:
          type: array
          maxItems: 4
          description: Published integer prices, newest first. A published rate is not proof of enabled billing; only active_meters names currently billed sources. Builds retain their accepted quote. Provider cost is a list-price basis before platform allowances, not an invoice.
          items:
            $ref: "#/components/schemas/PublishedCreditRateCard"
    UsageTotal:
      type: string
      description: Non-negative integer aggregate, serialized exactly without floating-point rounding.
      pattern: "^(0|[1-9][0-9]{0,37})$"
    OrganizationCreditUsage:
      type: object
      additionalProperties: false
      required: [organization_id, month, as_of, unit, data, next_cursor]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        month:
          type: string
          pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$"
        as_of:
          type: string
          format: date-time
        unit:
          type: string
          const: microcredits
        next_cursor:
          oneOf:
            - $ref: "#/components/schemas/Ulid"
            - type: "null"
        data:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [project_id, reserved_micros, meters]
            properties:
              project_id:
                $ref: "#/components/schemas/Ulid"
              reserved_micros:
                $ref: "#/components/schemas/UsageTotal"
              meters:
                type: array
                maxItems: 1000
                items:
                  type: object
                  additionalProperties: false
                  required:
                    [
                      environment_id,
                      meter,
                      unit,
                      rate_card_id,
                      quantity,
                      charged_micros,
                      funded_micros,
                      platform_overrun_micros,
                    ]
                  properties:
                    environment_id:
                      oneOf:
                        - $ref: "#/components/schemas/Ulid"
                        - type: "null"
                    meter:
                      type: string
                      pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
                    unit:
                      type: string
                      pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
                    rate_card_id:
                      type: string
                      pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
                    quantity:
                      $ref: "#/components/schemas/UsageTotal"
                    charged_micros:
                      $ref: "#/components/schemas/UsageTotal"
                    funded_micros:
                      $ref: "#/components/schemas/UsageTotal"
                    platform_overrun_micros:
                      $ref: "#/components/schemas/UsageTotal"
    PublishedCreditRateCard:
      type: object
      additionalProperties: false
      required: [id, currency, published_at, effective_from, rates]
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_.-]{1,128}$
        currency:
          type: string
          const: USD
        published_at:
          type: string
          format: date-time
        effective_from:
          type: string
          format: date-time
        rates:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [meter, unit, units_per_charge, provider_cost_micros, credit_micros]
            properties:
              meter:
                type: string
                pattern: ^[a-z0-9_.-]{1,128}$
              unit:
                type: string
                pattern: ^[a-z0-9_.-]{1,128}$
              units_per_charge:
                type: string
                pattern: ^[1-9][0-9]{0,18}$
              provider_cost_micros:
                type: string
                pattern: ^(0|[1-9][0-9]{0,18})$
                description: Provider list-cost basis for units_per_charge, in USD micro-units (1000000 equals 1 USD), before shared allowances and discounts.
              credit_micros:
                $ref: "#/components/schemas/CreditMicros"
    SetProjectCreditBudgetRequest:
      type: object
      additionalProperties: false
      required: [amount_micros, mode]
      properties:
        amount_micros:
          oneOf:
            - $ref: "#/components/schemas/CreditMicros"
            - type: "null"
        mode:
          type: string
          enum: [continue, stop]
    ProjectCreditBudget:
      type: object
      additionalProperties: false
      required:
        [
          project_id,
          amount_micros,
          mode,
          used_micros,
          reserved_micros,
          period_start,
          period_end,
          as_of,
        ]
      properties:
        project_id:
          $ref: "#/components/schemas/Ulid"
        amount_micros:
          oneOf:
            - $ref: "#/components/schemas/CreditMicros"
            - type: "null"
        mode:
          type: string
          enum: [continue, stop]
        used_micros:
          $ref: "#/components/schemas/CreditMicros"
        reserved_micros:
          $ref: "#/components/schemas/CreditMicros"
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        as_of:
          type: string
          format: date-time
    CreateCloudflareDnsAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - zone
      properties:
        zone:
          type: string
          minLength: 4
          maxLength: 253
          pattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
    CloudflareDnsAuthorization:
      type: object
      description: Short-lived credential-free redirect information for one Cloudflare OAuth authorization.
      additionalProperties: false
      required:
        - authorization_id
        - authorization_url
        - expires_at
      properties:
        authorization_id:
          $ref: "#/components/schemas/Ulid"
        authorization_url:
          type: string
          format: uri
          minLength: 20
          maxLength: 4096
          pattern: '^https://dash\.cloudflare\.com/oauth2/auth\?'
        expires_at:
          type: string
          format: date-time
    CloudflareDnsAuthorizationStatus:
      type: object
      description: Credential-free project authorization state. Without an authorization, status is not_authorized, zone and expires_at are null, and scopes is empty. All other states name the actual customer zone; no platform or customer zone is inferred.
      additionalProperties: false
      required:
        - status
        - zone
        - scopes
        - expires_at
      properties:
        status:
          type: string
          enum:
            - not_authorized
            - pending
            - authorized
            - expired
            - revoked
        zone:
          type: [string, "null"]
          minLength: 4
          maxLength: 253
          pattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
        scopes:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            type: string
            enum:
              - dns.write
              - zone.read
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    PaidDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname:
          type: string
          minLength: 4
          maxLength: 253
          pattern: '^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
    PaidDomainPlan:
      type: object
      additionalProperties: false
      required: [status, hostname, environment, cname_target, effects, risks]
      properties:
        status: { type: string, const: planned }
        hostname: { type: string, minLength: 4, maxLength: 253 }
        environment: { type: string, const: prod }
        cname_target: { type: string, enum: [customers.omh.st, customers.ohmyho.st] }
        effects:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 512 }
        risks:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 512 }
    PaidDomain:
      type: object
      additionalProperties: false
      required:
        - status
        - suspension_reason
        - hostname
        - environment
        - cname_target
        - custom_hostname_status
        - ssl_status
        - validation_records
        - url
      properties:
        status:
          type: string
          enum: [not_configured, pending, active, reconciliation_required, deleted, suspended]
        suspension_reason:
          type: [string, "null"]
          enum:
            [paid_plan_required, insufficient_organization_credits, project_budget_exceeded, null]
          description: Non-null only while suspended by the same Paid, credit-grace or stop-budget policy used by the gateway. DNS/TLS receipts remain intact; url is null while suspended.
        hostname:
          oneOf:
            - type: string
              minLength: 4
              maxLength: 253
            - type: "null"
        environment: { type: string, const: prod }
        cname_target: { type: string, enum: [customers.omh.st, customers.ohmyho.st] }
        custom_hostname_status:
          type: [string, "null"]
        ssl_status:
          type: [string, "null"]
        validation_records:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [type, name, content, purpose]
            properties:
              type: { type: string, enum: [CNAME, TXT] }
              name: { type: string, minLength: 1, maxLength: 253 }
              content: { type: string, minLength: 1, maxLength: 2048 }
              purpose: { type: string, enum: [traffic, ownership, ssl, dcv_delegation] }
        url:
          oneOf:
            - type: string
              format: uri
              pattern: ^https://
            - type: "null"
    PutEnvironmentSecretRequest:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          type: string
          description: Write-only plaintext value. It is encrypted before persistence and never returned.
          minLength: 1
          maxLength: 5120
          writeOnly: true
    EnvironmentSecret:
      type: object
      description: Environment secret metadata. The plaintext and ciphertext are never returned.
      additionalProperties: false
      required:
        - name
        - revision
        - key_version
        - created_at
        - updated_at
        - desired_generation
        - applied_generation
        - delivery_state
        - runtime_provider
        - applied_secret_count
        - last_error
      properties:
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,127}$
        revision:
          type: integer
          minimum: 1
        key_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        desired_generation:
          type: integer
          minimum: 0
        applied_generation:
          type: integer
          minimum: 0
        delivery_state:
          type: string
          enum: [not_deployed, pending, ready, failed]
        runtime_provider:
          type: [string, "null"]
          enum: [wfp, null]
        applied_secret_count:
          type: integer
          minimum: 0
          maximum: 100
        last_error:
          type: [string, "null"]
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    EnvironmentSecretPage:
      type: object
      additionalProperties: false
      required:
        - items
        - desired_generation
        - applied_generation
        - delivery_state
        - runtime_provider
        - applied_secret_count
        - last_error
      properties:
        items:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/EnvironmentSecret"
        desired_generation:
          type: integer
          minimum: 0
        applied_generation:
          type: integer
          minimum: 0
        delivery_state:
          type: string
          enum: [not_deployed, pending, ready, failed]
        runtime_provider:
          type: [string, "null"]
          enum: [wfp, null]
        applied_secret_count:
          type: integer
          minimum: 0
          maximum: 100
        last_error:
          type: [string, "null"]
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    DeleteEnvironmentSecretResult:
      type: object
      additionalProperties: false
      required:
        - name
        - status
        - desired_generation
        - applied_generation
        - delivery_state
        - runtime_provider
        - applied_secret_count
        - last_error
      properties:
        name:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,127}$
        status:
          type: string
          enum:
            - deleted
            - absent
        desired_generation:
          type: integer
          minimum: 0
        applied_generation:
          type: integer
          minimum: 0
        delivery_state:
          type: string
          enum: [not_deployed, pending, ready, failed]
        runtime_provider:
          type: [string, "null"]
          enum: [wfp, null]
        applied_secret_count:
          type: integer
          minimum: 0
          maximum: 100
        last_error:
          type: [string, "null"]
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
    LinkProjectSourceRequest:
      type: object
      additionalProperties: false
      required:
        - repository_owner
        - repository_name
      properties:
        repository_owner:
          type: string
          minLength: 1
          maxLength: 39
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
        repository_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9._-]+$
    ConfigureSourceAutoDeployRequest:
      type: object
      additionalProperties: false
      required: [branch, enabled]
      properties:
        branch:
          type: string
          description: Exact Git branch accepted by Git check-ref-format branch rules; control/space, dot-lock, reflog, range and metacharacter forms are rejected.
          minLength: 1
          maxLength: 1024
          pattern: '^(?!.*(?:\.\.|@\{|//|\\|[~^:?*\[\]\x00-\x20\x7f]))(?!.*(?:^|/)\.)(?!.*(?:^|/)[^/]*\.lock(?:/|$))(?!.*\.$)[A-Za-z0-9][A-Za-z0-9._/-]{0,1023}$'
        enabled:
          type: boolean
    SourceAutoDeploy:
      type: object
      additionalProperties: false
      description: Push-to-deploy configuration. Generation 0 with null branch, ref, grant_status and updated_at means auto-deploy was never configured for this project.
      required: [branch, ref, environment, enabled, generation, grant_status, updated_at]
      properties:
        branch:
          type: [string, "null"]
        ref:
          type: [string, "null"]
          pattern: ^refs/heads/
        environment:
          type: string
          enum: [dev]
        enabled:
          type: boolean
        generation:
          type: integer
          minimum: 0
        grant_status:
          type: [string, "null"]
          enum: [active, revoked, null]
        updated_at:
          type: [string, "null"]
          format: date-time
    ConnectGithubOrganizationRequest:
      type: object
      additionalProperties: false
    GithubOrganizationConnection:
      type: object
      additionalProperties: false
      required:
        [
          connection_id,
          organization_id,
          installation_id,
          account_id,
          account_login,
          account_type,
          github_user_id,
          github_user_login,
          connected_at,
          revoked_at,
          settings_url,
        ]
      properties:
        connection_id: { $ref: "#/components/schemas/Ulid" }
        organization_id: { $ref: "#/components/schemas/Ulid" }
        installation_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        account_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        account_login: { type: string, minLength: 1, maxLength: 39 }
        account_type: { type: string, enum: [User, Organization] }
        github_user_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        github_user_login: { type: string, minLength: 1, maxLength: 39 }
        connected_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        settings_url: { type: string, format: uri }
    GithubOrganizationConnectionStatus:
      type: object
      additionalProperties: false
      required: [status, connection]
      properties:
        status: { type: string, enum: [not_connected, connected, revoked] }
        connection:
          oneOf:
            - $ref: "#/components/schemas/GithubOrganizationConnection"
            - type: "null"
    GithubConnectionAuthorization:
      type: object
      additionalProperties: false
      required: [authorization_id, status, last_failure, authorization_url, expires_at, connection]
      properties:
        authorization_id: { type: [string, "null"], pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$" }
        status: { type: string, enum: [pending, authorizing, connected, failed, expired] }
        last_failure:
          type: [string, "null"]
          enum:
            [
              installation_access_required,
              account_admin_required,
              authorization_code_rejected,
              provider_unavailable,
              expired,
              session_inactive,
              denied,
              code_spent,
              state_unknown,
              null,
            ]
        authorization_url:
          type: [string, "null"]
          format: uri
          description: One GitHub browser authorization link when pending; contains only the bound single-use state, never a provider credential.
        expires_at: { type: [string, "null"], format: date-time }
        connection:
          oneOf:
            - $ref: "#/components/schemas/GithubOrganizationConnection"
            - type: "null"
    GithubSourceAuthorization:
      type: object
      additionalProperties: false
      required:
        [
          authorization_id,
          status,
          last_failure,
          authorization_url,
          installation_url,
          expires_at,
          operation_id,
          installation_id,
          repository_id,
          repository_owner,
          repository_name,
        ]
      properties:
        authorization_id:
          $ref: "#/components/schemas/Ulid"
        status:
          type: string
          enum: [pending, authorizing, authorized, failed, expired]
        last_failure:
          type: [string, "null"]
          description: Why the last callback did not finish. A pending authorization that carries one is resumable; resolve the named cause, then open authorization_url again without a new key.
          enum:
            - repository_not_installed
            - repository_access_required
            - authorization_code_rejected
            - provider_unavailable
            - expired
            - session_inactive
            - denied
            - code_spent
            - null
        authorization_url:
          type: [string, "null"]
          format: uri
          description: Open only when pending; contains the single-use state and PKCE challenge, never a provider credential.
        installation_url:
          type: [string, "null"]
          format: uri
          description: Install or update the GitHub App's selected repository access before authorizing, if required.
        expires_at:
          type: string
          format: date-time
        operation_id:
          type: [string, "null"]
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
        installation_id:
          type: [string, "null"]
          pattern: ^[1-9][0-9]*$
        repository_id:
          type: [string, "null"]
          pattern: ^[1-9][0-9]*$
        repository_owner:
          type: string
        repository_name:
          type: string
    ProjectSource:
      type: object
      additionalProperties: false
      required:
        - provider
        - installation_id
        - repository_full_name
        - status
        - linked_at
        - updated_at
      properties:
        provider:
          type: string
          const: github
        installation_id:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 20
        repository_full_name:
          type: string
          minLength: 3
          maxLength: 201
          pattern: ^[^/]+/[^/]+$
        status:
          type: string
          enum:
            - pending
            - ready
            - failed
            - revoked
        linked_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        failure_summary:
          type: string
          minLength: 1
          maxLength: 512
    FunctionRun:
      type: object
      additionalProperties: false
      required:
        [
          id,
          deployment_id,
          cron,
          scheduled_at,
          state,
          attempt,
          status_code,
          started_at,
          finished_at,
        ]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        deployment_id: { $ref: "#/components/schemas/Ulid" }
        cron: { type: string, maxLength: 64 }
        scheduled_at: { type: string, format: date-time }
        state: { type: string, enum: [due, running, retry, succeeded, failed] }
        attempt: { type: integer, minimum: 0, maximum: 3 }
        status_code: { type: [integer, "null"], minimum: 100, maximum: 599 }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    FunctionRunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/FunctionRun" }
    DeploymentDiagnostic:
      type: object
      additionalProperties: false
      required: [id, source, code, message, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        source: { type: string, enum: [build, control, runtime, function] }
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
        message: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,127}$" }
        exception_class: { type: string, maxLength: 128 }
        file: { type: string, maxLength: 512 }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 0 }
        route: { type: string, maxLength: 512 }
        request_id: { type: string, maxLength: 128 }
        trace_id: { type: string, maxLength: 128 }
        duration_ms: { type: integer, minimum: 0, maximum: 900000 }
        excerpt:
          type: string
          minLength: 1
          maxLength: 16384
          description: The sanitized tail of the customer's own install/build output, newest lines last. Present only on a BUILD_FAILED diagnostic; terminal escapes and control characters are removed before storage.
        excerpt_truncated:
          type: boolean
          description: Whether earlier build output was omitted from excerpt. Present exactly when excerpt is present.
        occurred_at: { type: string, format: date-time }
    DeploymentDiagnosticPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DeploymentDiagnostic" }
        next_cursor: { type: string, maxLength: 2048 }
    ProjectDatabaseWriteRequest:
      type: object
      additionalProperties: false
      required: [environment, statement, parameters]
      properties:
        environment: { type: string, enum: [dev, prod] }
        statement:
          type: string
          minLength: 1
          maxLength: 65536
          description: One direct INSERT, UPDATE or DELETE, max 64 KiB UTF-8; entire JSON request is limited to 65,600 bytes.
        parameters:
          type: array
          maxItems: 100
          items: {}
          description: JSON values, at most 8 levels and 10000 nodes, max 64 KiB encoded.
    ProjectDatabaseWriteReceipt:
      type: object
      additionalProperties: false
      required: [operation_id, environment, state, command, affected_rows, error]
      properties:
        operation_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        state: { type: string, enum: [running, succeeded, failed] }
        command: { type: [string, "null"], enum: [INSERT, UPDATE, DELETE, null] }
        affected_rows: { type: [integer, "null"], minimum: 0, maximum: 1000 }
        error:
          oneOf:
            - $ref: "#/components/schemas/OperationFailure"
            - type: "null"
    ProjectDatabaseQueryRequest:
      type: object
      additionalProperties: false
      required: [environment, statement, parameters]
      properties:
        environment:
          type: string
          enum: [dev, prod]
        statement:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: ^\s*(?:SELECT|WITH)\b
        parameters:
          type: array
          maxItems: 32
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
    ProjectDatabaseQueryResult:
      type: object
      additionalProperties: false
      required: [environment, rows, row_count, truncated]
      properties:
        environment:
          type: string
          enum: [dev, prod]
        rows:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
        row_count:
          type: integer
          minimum: 0
          maximum: 100
        truncated:
          type: boolean
    ProjectDatabaseAccessRequest:
      type: object
      additionalProperties: false
      required: [environment]
      properties:
        environment:
          type: string
          enum: [dev, prod]
        mode:
          type: string
          enum: [read, write]
          default: read
          description: read joins the read-only role; write joins the restricted runtime role. Neither can change schema.
        ttl_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          default: 3600
          description: Credential lifetime between 5 minutes and 24 hours.
        label:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: Optional customer label without control characters or surrounding whitespace.
    ProjectDatabaseAccess:
      type: object
      additionalProperties: false
      required:
        - access_id
        - environment
        - mode
        - role_name
        - host
        - database
        - label
        - state
        - issued_at
        - expires_at
        - revoked_at
        - revocation_reason
      properties:
        access_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        mode: { type: string, enum: [read, write] }
        role_name:
          type: string
          pattern: ^ohmyho_da_[0-7][0-9a-hjkmnp-tv-z]{25}_[0-9a-z]{8}$
        host: { type: string, minLength: 1, maxLength: 253 }
        database: { type: string, const: neondb }
        label: { type: [string, "null"], minLength: 1, maxLength: 64 }
        state: { type: string, enum: [active, expired, revoked] }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revocation_reason:
          type: [string, "null"]
          enum: [principal, expired, budget, creation_failed, null]
    ProjectDatabaseAccessCredential:
      allOf:
        - $ref: "#/components/schemas/ProjectDatabaseAccess"
        - type: object
          additionalProperties: false
          required: [connection_uri, psql_command]
          properties:
            connection_uri:
              type: string
              format: uri
              description: Returned exactly once. Use it immediately and never store it in files, notes or source.
            psql_command:
              type: string
              description: The same credential as a ready psql invocation.
    ProjectDatabaseAccessPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ProjectDatabaseAccess" }
    SetDevAccessModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [protected, public]
    DevAccessState:
      type: object
      additionalProperties: false
      required: [project_id, mode, share_url]
      properties:
        project_id:
          $ref: "#/components/schemas/Ulid"
        mode:
          type: string
          enum: [protected, public]
        share_url:
          description: Owner-only persistent bearer link in protected mode; null when public or revoked.
          oneOf:
            - type: string
              format: uri
              pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st/\.ohmyhost/dev-access/redeem\?stage=dev&ticket=[A-Za-z0-9_-]{43}$
            - type: "null"
    DevAccessTicket:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - project_id
        - environment_id
        - origin
        - redeem_url
        - expires_at
      properties:
        ticket_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        environment_id:
          $ref: "#/components/schemas/Ulid"
        origin:
          type: string
          format: uri
          pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
        redeem_url:
          type: string
          format: uri
          pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st/\.ohmyhost/dev-access/redeem\?stage=dev&ticket=[A-Za-z0-9_-]{43}$
        expires_at:
          type: string
          format: date-time
    PlanDeploymentRequest:
      type: object
      additionalProperties: false
      required:
        - commit_sha
      properties:
        commit_sha:
          $ref: "#/components/schemas/GitCommitSha"
        environment:
          type: string
          enum:
            - dev
            - prod
          default: dev
          description: The environment the deployment builds into. Prod skips Dev and switches Prod traffic once activated.
    CreateDeploymentRequest:
      type: object
      additionalProperties: false
      required:
        - plan_id
      properties:
        plan_id:
          $ref: "#/components/schemas/Ulid"
    DeploymentPlan:
      type: object
      description: Immutable pre-build deployment plan. It expires exactly 24 hours after creation.
      additionalProperties: false
      x-ohmyhost-ttl-seconds: 86400
      required:
        - id
        - project_id
        - environment
        - commit_sha
        - source_digest
        - build_plan_digest
        - application_root
        - runtime
        - route
        - resource_effects
        - limits
        - estimated_cost
        - risks
        - destructive_effects
        - required_confirmations
        - created_at
        - expires_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        environment:
          type: string
          enum:
            - dev
            - prod
          description: The environment this plan builds into.
        commit_sha:
          $ref: "#/components/schemas/GitCommitSha"
        source_digest:
          $ref: "#/components/schemas/Sha256Digest"
        build_plan_digest:
          $ref: "#/components/schemas/Sha256Digest"
        application_root:
          type: string
          description: Canonical repository-relative application root selected from immutable source evidence.
          readOnly: true
          maxLength: 64
          pattern: '^(?:\.|[A-Za-z0-9][A-Za-z0-9._-]{0,62}(?:/[A-Za-z0-9][A-Za-z0-9._-]{0,62}){0,7})$'
        artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        runtime:
          type: string
          enum:
            - cloudflare_workers_static_assets
            - cloudflare_workers_edge_ssr
        route:
          type: string
          description: Server-derived project-isolated public deployment URL; clients cannot select its gateway host or target Worker.
          format: uri
          pattern: ^https://
        resource_effects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        limits:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        estimated_cost:
          $ref: "#/components/schemas/CostEstimate"
        risks:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        destructive_effects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        required_confirmations:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CostEstimate:
      type: object
      description: Build-compute reservation quote, not the lifetime cost of the application. credits is the reserved amount in credits as a decimal (credit_micros divided by one million), the figure to show people. amount_micros is the customer USD equivalent of credit_micros; provider_cost_micros is the corresponding published provider-list basis. The versioned price is fixed by this immutable deployment plan. reserved_seconds is the reserved build time in seconds. The measured build seconds settle the reservation and unused credits are released. Storage, mail and runtime costs are separate.
      additionalProperties: false
      required:
        - amount_micros
        - currency
        - rate_card_version
        - credit_micros
        - credits
        - provider_cost_micros
        - scope
        - reserved_seconds
      properties:
        amount_micros:
          type: string
          pattern: ^[0-9]+$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        rate_card_version:
          type: string
          minLength: 1
          maxLength: 128
        credit_micros:
          type: string
          pattern: ^[0-9]+$
        credits:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
        provider_cost_micros:
          type: string
          pattern: ^[0-9]+$
        scope:
          type: string
          const: build_compute
        reserved_seconds:
          type: string
          pattern: ^[1-9][0-9]*$
    Deployment:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - operation_id
        - commit_sha
        - source_digest
        - build_plan_digest
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        commit_sha:
          $ref: "#/components/schemas/GitCommitSha"
        source_digest:
          $ref: "#/components/schemas/Sha256Digest"
        build_plan_digest:
          $ref: "#/components/schemas/Sha256Digest"
        artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        status:
          type: string
          enum:
            - queued
            - building
            - publishing
            - active
            - failed
            - rolled_back
            - deleting
            - deleted
            - reconciliation_required
        url:
          type: string
          description: Project-isolated public gateway URL for the observed deployment.
          format: uri
          pattern: ^https://
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DeploymentPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Deployment"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9_-]+$
    GuardedActionPlan:
      type: object
      description: Non-mutating guarded-action plan with a confirmation token that expires exactly ten minutes after creation.
      additionalProperties: false
      x-ohmyhost-ttl-seconds: 600
      required:
        - action
        - project_id
        - resource_etag
        - effects
        - risks
        - confirmation_token
        - created_at
        - expires_at
      properties:
        action:
          type: string
          enum:
            - rollback
            - promote
            - delete
        project_id:
          $ref: "#/components/schemas/Ulid"
        target_deployment_id:
          $ref: "#/components/schemas/Ulid"
        target_artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        source_deployment_id:
          $ref: "#/components/schemas/Ulid"
        source_artifact_digest:
          $ref: "#/components/schemas/Sha256Digest"
        source_environment:
          type: string
          const: dev
        target_environment:
          type: string
          const: prod
        resource_etag:
          type: string
          minLength: 3
          maxLength: 128
        effects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        risks:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
        confirmation_token:
          $ref: "#/components/schemas/ConfirmationToken"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      oneOf:
        - properties:
            action:
              const: rollback
          required:
            - target_deployment_id
            - target_artifact_digest
        - properties:
            action:
              const: promote
          required:
            - source_deployment_id
            - source_artifact_digest
            - source_environment
            - target_environment
        - properties:
            action:
              const: delete
          not:
            anyOf:
              - required:
                  - target_deployment_id
              - required:
                  - target_artifact_digest
              - required:
                  - source_deployment_id
              - required:
                  - source_artifact_digest
              - required:
                  - source_environment
              - required:
                  - target_environment
    ConfirmationToken:
      type: string
      description: Opaque, single-action token bound to the planned action, project, target resource, and resource ETag.
      minLength: 32
      maxLength: 4096
      pattern: ^[A-Za-z0-9._~-]+$
    GitCommitSha:
      type: string
      description: Exact full Git commit object identifier; abbreviated or branch references are forbidden.
      pattern: ^[0-9a-f]{40}$
    Sha256Digest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    ProjectDataMode:
      type: string
      enum: [shared, isolated]
      default: shared
      description: Chosen when the project is created. shared uses one database and a shared file namespace across Dev/Prod; isolated keeps their database/Auth records and files separate. Skills recommend isolated development, but the customer chooses the additional measured database consumption. Promotion applies pending schema migrations to an isolated Prod database without copying Dev data. Changing an established mode requires an explicit data migration.
    HostingRegion:
      type: string
      enum: [us, eu]
      default: us
      description: Chosen when the project is created and immutable afterwards. us (default) places the project's database, files, build sandbox and build objects in the US; eu places them in the EU. Prices are identical. ohmyhost.yaml storage.jurisdiction must equal this value.
    FeedbackSubmission:
      type: object
      additionalProperties: false
      required: [organization_id, kind, title, description]
      dependentRequired:
        environment_id: [project_id]
        operation_id: [project_id]
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        environment_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        kind:
          type: string
          enum: [bug, issue, feature_request]
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Trimmed title without control characters.
        description:
          type: string
          minLength: 1
          maxLength: 8000
          description: Trimmed, redacted expected/actual behavior and minimal reproduction. Line breaks and tabs are accepted; other control characters are rejected. Never include raw logs, environment files, credentials or personal records.
        error_code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$"
          maxLength: 128
        client_version:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/+-]{0,127}$"
          maxLength: 128
    FeedbackReceipt:
      type: object
      additionalProperties: false
      required: [id, organization_id, submitted_at]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        organization_id:
          $ref: "#/components/schemas/Ulid"
        submitted_at:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      description: Phase 1 project creation request. The server assigns resource identifiers.
      additionalProperties: false
      required:
        - organization_id
        - name
      properties:
        organization_id:
          $ref: "#/components/schemas/Ulid"
        data_mode:
          $ref: "#/components/schemas/ProjectDataMode"
        dev_access_mode:
          type: string
          enum: [protected, public]
          default: protected
        region:
          $ref: "#/components/schemas/HostingRegion"
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\S(?:.*\\S)?$"
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        signup_source:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
          minLength: 1
          maxLength: 64
          description: Optional public acquisition source from a link's r parameter. Signup is open and this value grants nothing; omit it when the customer arrived directly. Promotional credits are server-configured, attribution is fixed for the user, and rewards are never multiplied by retries or additional organizations.
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\S(?:.*\\S)?$"
    Organization:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 128
    AccountProfile:
      type: object
      additionalProperties: false
      required:
        [
          user_id,
          name,
          email,
          email_verified,
          organizations,
          organization_ids,
          signup_source,
          attributed_at,
          initial_workspace_id,
        ]
      properties:
        user_id: { type: string, pattern: "^user_[A-Za-z0-9_]{1,123}$" }
        name: { type: string, maxLength: 256 }
        email: { type: string, format: email, maxLength: 254 }
        email_verified: { type: boolean }
        organizations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, workos_id, name]
            properties:
              id: { $ref: "#/components/schemas/Ulid" }
              workos_id: { type: string }
              name: { type: string }
        organization_ids: { type: array, items: { $ref: "#/components/schemas/Ulid" } }
        signup_source: { type: [string, "null"], maxLength: 64 }
        attributed_at: { type: [string, "null"], format: date-time }
        initial_workspace_id: { type: [string, "null"], pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    OrganizationAccount:
      type: object
      additionalProperties: false
      required:
        [
          organization_id,
          name,
          workos_organization_id,
          plan,
          plan_source,
          paid_until,
          available_micros,
          monthly_micros,
          one_time_micros,
          reserved_micros,
          next_expiry,
          as_of,
        ]
      properties:
        organization_id: { $ref: "#/components/schemas/Ulid" }
        name: { type: string }
        workos_organization_id: { type: string }
        plan: { type: string, enum: [free, paid] }
        plan_source: { type: string, enum: [free, stripe, granted, manual] }
        paid_until: { type: [string, "null"], format: date-time }
        available_micros: { $ref: "#/components/schemas/CreditMicros" }
        monthly_micros: { $ref: "#/components/schemas/CreditMicros" }
        one_time_micros: { $ref: "#/components/schemas/CreditMicros" }
        reserved_micros: { $ref: "#/components/schemas/CreditMicros" }
        next_expiry: { type: [string, "null"], format: date-time }
        as_of: { type: string, format: date-time }
    CurrentIdentity:
      type: object
      description: Minimal customer-visible identity and organization scope for authenticated agent clients.
      additionalProperties: false
      required:
        - actor_id
        - organization_ids
      properties:
        actor_id:
          type: string
          minLength: 1
          maxLength: 256
        organization_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Ulid"
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - name
        - handle
        - data_mode
        - region
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        organization_id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\S(?:.*\\S)?$"
        handle:
          type: string
          minLength: 3
          maxLength: 59
          pattern: ^[a-z0-9]+(-[a-z0-9]+){0,4}$
        data_mode:
          $ref: "#/components/schemas/ProjectDataMode"
        region:
          $ref: "#/components/schemas/HostingRegion"
        created_at:
          type: string
          format: date-time
    ProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    ProjectEnvironment:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 128
    ProjectHandleAvailability:
      type: object
      additionalProperties: false
      required:
        - handle
        - available
        - alternatives
      properties:
        handle:
          type: string
          description: The handle exactly as it was asked about.
        available:
          type: boolean
          description: True when a project may take this handle now.
        reason:
          type: string
          description: Why the handle cannot be used. Absent when it is available.
          enum:
            - taken
            - too_short
            - too_long
            - invalid_shape
            - prohibited_word
        alternatives:
          type: array
          description: Free handles to offer instead, empty when the handle is available.
          maxItems: 5
          items:
            type: string
    ProjectStatus:
      type: object
      additionalProperties: false
      required:
        - project_id
        - etag
        - handle
        - region
        - dev_access_mode
        - lifecycle
        - source
        - default_environment
        - head_deployment
        - dev_url
        - prod_url
        - latest_operation
        - cleanup_state
      properties:
        etag:
          type: string
          pattern: '^"sha256-[a-f0-9]{64}"$'
          description: Optimistic-concurrency token for changing this project address; use it as If-Match on the handle endpoint.
        project_id:
          $ref: "#/components/schemas/Ulid"
        handle:
          type: string
          minLength: 3
          maxLength: 59
          pattern: ^[a-z0-9]+(-[a-z0-9]+){0,4}$
        region:
          $ref: "#/components/schemas/HostingRegion"
        dev_access_mode:
          type: string
          enum: [protected, public]
        lifecycle:
          type: string
          enum:
            - active
            - deleting
            - deleted
        source:
          oneOf:
            - $ref: "#/components/schemas/ProjectSource"
            - type: "null"
        default_environment:
          oneOf:
            - $ref: "#/components/schemas/ProjectEnvironment"
            - type: "null"
        environments:
          type: array
          maxItems: 2
          description: Tenant-scoped Dev and Prod environment IDs for secrets and other environment-scoped commands. Select by name; never infer the Prod ID from the default Dev environment.
          items:
            $ref: "#/components/schemas/ProjectEnvironment"
        head_deployment:
          oneOf:
            - $ref: "#/components/schemas/Deployment"
            - type: "null"
        dev_url:
          oneOf:
            - type: string
              format: uri
              pattern: ^https://dev-[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
            - type: "null"
        prod_url:
          oneOf:
            - type: string
              format: uri
              pattern: ^https://[a-z0-9]+(?:-[a-z0-9]+){0,4}\.(?:dev\.)?check\.omh\.st$
            - type: "null"
        latest_operation:
          oneOf:
            - $ref: "#/components/schemas/Operation"
            - type: "null"
        cleanup_state:
          type: string
          enum:
            - not_started
            - pending
            - completed
            - reconciliation_required
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details extended with stable ohmyhost recovery fields.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - request_id
        - retryable
        - suggested_action
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - invalid_request
            - unauthenticated
            - forbidden
            - organization_required
            - resource_not_found
            - idempotency_key_reused
            - project_handle_unavailable
            - project_identity_unavailable
            - deployment_plan_expired
            - deployment_plan_incompatible
            - confirmation_expired
            - confirmation_invalid
            - etag_mismatch
            - promotion_source_stale
            - promotion_target_stale
            - promotion_invalid_target
            - mail_domain_conflict
            - mail_domain_required
            - storage_jurisdiction_conflict
            - shared_data_requires_promotion
            - framework_conversion_required
            - repository_configuration_missing
            - migration_filename_noncanonical
            - environment_secret_mutation_blocked
            - workers_runtime_incompatible
            - project_handle_invalid
            - project_handle_taken
            - project_handle_unchanged
            - project_rename_blocked
            - payload_too_large
            - rate_limited
            - insufficient_organization_credits
            - paid_plan_required
            - project_budget_exceeded
            - compute_performance_paid_required
            - compute_performance_unavailable
            - database_write_pending
            - database_access_limit
            - compute_change_pending
            - compute_change_conflict
            - billing_purchase_conflict
            - billing_recharge_conflict
            - github_connection_required
            - github_connection_revoked
            - repository_not_installed
            - cloudflare_zone_not_bound
            - cloudflare_authorization_closed
            - project_notes_conflict
            - project_export_not_ready
            - interactive_login_required
            - api_key_creation_uncertain
            - api_key_permissions_unavailable
            - reconciliation_exhausted
            - service_unavailable
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        retryable:
          type: boolean
        retry_after_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Optional machine-readable retry delay for a rate limit, matching Retry-After.
        suggested_action:
          type: string
          minLength: 1
    Operation:
      type: object
      description: Durable record returned for an accepted asynchronous mutation. Optional reconciliation is a current observation for queued/running work, separate from immutable terminal state. A completed reconciliation attempt alone does not mean the operation succeeded.
      additionalProperties: false
      required:
        - id
        - state
        - created_at
        - updated_at
      properties:
        blocking_operation_id:
          description: The active operation holding this queued operation's project mutation claim.
          $ref: "#/components/schemas/Ulid"
        id:
          $ref: "#/components/schemas/Ulid"
        state:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: true
        error:
          $ref: "#/components/schemas/OperationFailure"
        progress:
          $ref: "#/components/schemas/OperationDeploymentProgress"
        reconciliation:
          $ref: "#/components/schemas/OperationReconciliation"
    OperationDeploymentProgress:
      type: object
      additionalProperties: false
      description: Current deployment dependency observation, separate from immutable operation history. Poll the same operation; mail readiness does not mean application activation.
      required:
        [phase, project_id, deployment_id, observed_at, next_poll_after_seconds, suggested_action]
      properties:
        build_completed_at:
          type: string
          format: date-time
          description: Actual successful build completion time when this operation ran a build; omitted for reused artifacts without a current build.
        phase:
          type: string
          enum: [queued, building, publishing, waiting_for_mail, mail_status_unavailable]
        project_id:
          $ref: "#/components/schemas/Ulid"
        deployment_id:
          $ref: "#/components/schemas/Ulid"
        observed_at:
          type: string
          format: date-time
        next_poll_after_seconds:
          type: integer
          const: 60
        suggested_action:
          type: string
          minLength: 1
          maxLength: 500
    OperationReconciliation:
      type: object
      additionalProperties: false
      required: [state, attempt_id, observed_at, suggested_action]
      properties:
        state:
          type: string
          enum: [required, pending]
        attempt_id:
          oneOf:
            - $ref: "#/components/schemas/Ulid"
            - type: "null"
          description: Active attempt for pending reconciliation; null when a new confirmed reconciliation is required.
        observed_at:
          type: string
          format: date-time
        suggested_action:
          type: string
          minLength: 1
          maxLength: 500
    ProviderReconciliationAttempt:
      type: object
      description: Provider-neutral status of one idempotent reconciliation attempt.
      additionalProperties: false
      required:
        - reconciliation_id
        - operation_id
        - state
      properties:
        reconciliation_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        state:
          type: string
          enum:
            - completed
            - pending
            - uncertain
    IdempotencyConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            code:
              const: idempotency_key_reused
    OperationEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - operation_id
        - project_id
        - type
        - occurred_at
      properties:
        event_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        type:
          type: string
          enum:
            - OperationQueued
            - OperationStarted
            - OperationSucceeded
            - OperationFailed
            - OperationCancelled
        occurred_at:
          type: string
          format: date-time
        failure:
          $ref: "#/components/schemas/OperationFailure"
    ProjectNotesReceipt:
      type: object
      additionalProperties: false
      required: [version, updated_at]
      properties:
        version: { type: integer, minimum: 1, maximum: 2147483647 }
        updated_at: { type: string, format: date-time }
    DatabaseCompute:
      type: object
      additionalProperties: false
      required: [project_id, environment, data_mode, observed_at, database]
      properties:
        project_id: { $ref: "#/components/schemas/Ulid" }
        environment: { type: string, enum: [dev, prod] }
        data_mode: { type: string, enum: [shared, isolated] }
        observed_at: { type: string, format: date-time }
        database:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                [
                  min_cu,
                  max_cu,
                  min_memory_gb,
                  max_memory_gb,
                  suspend_timeout_seconds,
                  state,
                  pending_state,
                  disabled,
                  region,
                ]
              properties:
                min_cu: { type: number, minimum: 0.25 }
                max_cu: { type: number, minimum: 0.25 }
                min_memory_gb: { type: number, minimum: 1 }
                max_memory_gb: { type: number, minimum: 1 }
                suspend_timeout_seconds:
                  {
                    type: integer,
                    minimum: -1,
                    maximum: 604800,
                    description: "Configured timeout: 0 is provider default; -1 disables suspension.",
                  }
                state: { type: string, enum: [init, active, idle] }
                pending_state: { type: [string, "null"], enum: [init, active, idle, null] }
                disabled: { type: boolean }
                region: { type: string, pattern: "^aws-[a-z0-9]+(?:-[a-z0-9]+)*-[0-9]+$" }
    ProjectContext:
      type: object
      additionalProperties: false
      required: [project_id, generated_at, credit_access, notes, markdown]
      properties:
        project_id: { $ref: "#/components/schemas/Ulid" }
        generated_at: { type: string, format: date-time }
        credit_access: { type: string, enum: [included, not_authorized] }
        markdown:
          { type: string, maxLength: 32768, description: At most 500 lines and 32768 UTF-8 bytes. }
        notes:
          type: object
          additionalProperties: false
          required: [version, markdown, updated_at]
          properties:
            version: { type: integer, minimum: 0, maximum: 2147483647 }
            markdown:
              {
                type: string,
                maxLength: 16384,
                description: At most 250 lines and 16384 UTF-8 bytes; untrusted user-authored text.,
              }
            updated_at: { type: [string, "null"], format: date-time }
    ProjectExport:
      type: object
      additionalProperties: false
      required:
        [
          id,
          project_id,
          state,
          requested_at,
          next_request_at,
          next_poll_after_seconds,
          error,
          archive,
        ]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        project_id: { $ref: "#/components/schemas/Ulid" }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        requested_at: { type: string, format: date-time }
        next_request_at: { type: string, format: date-time }
        next_poll_after_seconds: { type: [integer, "null"], enum: [5, null] }
        error:
          oneOf:
            - $ref: "#/components/schemas/OperationFailure"
            - { type: "null" }
        archive:
          oneOf:
            - $ref: "#/components/schemas/ProjectExportArchive"
            - { type: "null" }
    ProjectExportArchive:
      type: object
      additionalProperties: false
      required:
        [bytes, sha256, sql_files, captured_at, expires_at, download_url, download_expires_at]
      properties:
        bytes: { type: integer, minimum: 1, maximum: 536870912 }
        sha256: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        sql_files:
          type: array
          items: { type: string, enum: [dev.sql, prod.sql, shared.sql] }
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: dev.sql and/or prod.sql for isolated data, or shared.sql alone.
        captured_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        download_url: { type: [string, "null"], format: uri }
        download_expires_at: { type: [string, "null"], format: date-time }
    OperationFailure:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - suggested_action
      properties:
        code:
          type: string
          enum:
            - operation_failed
            - operation_abandoned
            - recovery_dispatch_failed
            - recovery_job_failed
            - recovery_input_expired
            - recovery_database_unavailable
            - recovery_checksum_mismatch
            - recovery_scope_unavailable
            - recovery_archive_too_large
            - build_not_started
            - build_failed
            - database_write_rejected
            - database_write_unavailable
            - database_write_outcome_unknown
            - database_compute_failed
            - database_compute_plan_changed
            - database_compute_rejected
            - database_migration_failed
            - insufficient_organization_credits
            - paid_plan_required
            - runtime_candidate_failed
            - runtime_candidate_rejected
            - storage_jurisdiction_conflict
            - provider_state_absent
        message:
          type: string
          minLength: 1
          maxLength: 512
        retryable:
          type: boolean
          const: false
          description: A terminal operation cannot be retried in place; follow suggested_action.
        suggested_action:
          type: string
          minLength: 1
          maxLength: 500
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - audit_event_id
        - project_id
        - event_type
        - actor_type
        - actor_id
        - payload
        - occurred_at
      properties:
        audit_event_id:
          $ref: "#/components/schemas/Ulid"
        project_id:
          $ref: "#/components/schemas/Ulid"
        operation_id:
          $ref: "#/components/schemas/Ulid"
        event_type:
          type: string
          minLength: 1
        actor_type:
          type: string
          minLength: 1
        actor_id:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/AuditPayloadSummary"
        occurred_at:
          type: string
          format: date-time
    AuditPayloadSummary:
      type: object
      description: A redacted, public summary of an internal audit payload.
      additionalProperties: false
      required:
        - summary
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 512
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9_-]+$
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
